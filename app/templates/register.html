<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - QuickServe</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-bg"> 
    <div class="container">
        <div class="row justify-content-center" style="min-height: 100vh; align-items: center;">
            <div class="col-md-5">
                
                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                                <i class="fas fa-user-plus fa-2x"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Create Account</h3>
                            <p class="text-muted small">Join QuickServe today</p>
                        </div>

                        {% with messages = get_flashed_messages(with_categories=true) %}
                          {% if messages %}
                            {% for category, message in messages %}
                              <div class="alert alert-{{ 'danger' if category=='error' else 'success' }} text-center p-2 small">
                                  {{ message }}
                              </div>
                            {% endfor %}
                          {% endif %}
                        {% endwith %}

                        <form action="/register" method="POST">
                            
                            <div class="form-floating mb-3">
                                <input type="text" name="username" class="form-control" id="regUser" placeholder="Username" required>
                                <label for="regUser"><i class="fas fa-user me-2"></i>Choose Username</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" name="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
                                <label for="regEmail"><i class="fas fa-envelope me-2"></i>Email Address</label>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" name="password" class="form-control" id="regPass" placeholder="Password" required>
                                <label for="regPass"><i class="fas fa-lock me-2"></i>Create Password</label>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 rounded-pill fw-bold shadow-sm">
                                Register Now
                            </button>
                        </form>

                    </div>
                    
                    <div class="card-footer bg-white border-0 text-center pb-3">
                        <small class="text-muted">Already have an account?</small>
                        <a href="/login" class="text-primary fw-bold text-decoration-none">Login Here</a>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <small class="text-white-50">&copy; 2026 QuickServe System</small>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
