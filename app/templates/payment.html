<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pay Now - QuickServe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 text-center">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0"><i class="fas fa-wallet me-2"></i>Secure Payment</h5>
                </div>
                <div class="card-body p-4">
                    <h6 class="text-muted">Total Amount</h6>
                    <h1 class="display-4 text-primary fw-bold">₹{{ appointment.price }}</h1>
                    <p class="text-muted mb-4">Scan with GPay/PhonePe</p>
                    <div class="mb-4 p-3 d-inline-block bg-white border rounded">
                        <img src="{{ qr_code }}" alt="UPI QR Code" class="img-fluid">
                    </div>
                    
                    <form action="/process_payment/{{ appointment.id }}" method="POST">
                        <div class="form-floating mb-3">
                            <input type="text" name="transaction_id" class="form-control" id="utrInput" 
                                   placeholder="Ex: 3425xxxx" minlength="10" maxlength="20" required>
                            <label for="utrInput">Enter Transaction ID (10-12 digits)</label>
                            <div class="form-text text-start ms-2"><i class="fas fa-lock me-1"></i> ID must be unique.</div>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Submit for Verification</button>
                    </form>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-danger mt-3">{{ message }}</div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                </div>
                <div class="card-footer bg-white border-0 pb-3">
                    <a href="{{ url_for('main.home') }}" class="text-muted text-decoration-none small">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
